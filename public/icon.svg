<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Shield / Crest Shape in Center -->
  <g filter="url(#shadow)">
    <path d="M 128 136 C 128 136 256 104 256 104 C 256 104 384 136 384 136 C 384 272 320 376 256 408 C 192 376 128 272 128 136 Z" fill="url(#redGrad)" />
  </g>

  <!-- Inner Crest Outline -->
  <path d="M 148 152 C 148 152 256 126 256 126 C 256 126 364 152 364 152 C 364 260 310 350 256 380 C 202 350 148 260 148 152 Z" fill="#0f172a" fill-opacity="0.25" stroke="#fecaca" stroke-width="4" stroke-opacity="0.3" />

  <!-- Academic Laurel / Ribbon Accent -->
  <circle cx="256" cy="240" r="76" fill="#090d16" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- IELTS 9.0 Band Typography Emblem -->
  <text x="256" y="235" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">IELTS</text>
  <text x="256" y="270" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f59e0b" text-anchor="middle" letter-spacing="3">BAND 9</text>

  <!-- Star accents -->
  <polygon points="256,168 261,180 274,180 263,188 267,200 256,192 245,200 249,188 238,180 251,180" fill="url(#goldGrad)" />
  <circle cx="206" cy="188" r="4" fill="#fbbf24" />
  <circle cx="306" cy="188" r="4" fill="#fbbf24" />

  <!-- Bottom Banner with READY -->
  <rect x="176" y="324" width="160" height="34" rx="17" fill="#ffffff" />
  <text x="256" y="347" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="4">ACADEMIC</text>
</svg>
